var HELP='<div class="help">'+
'<h4>Как устроено</h4><p>Библиотека: книга → отрывки. Отрывок выбираете сами во вкладке «Читать и выбрать»: нажмите на первый стих, затем на последний, и в отрывок войдут все стихи между ними, сколько угодно. Нажатие на стих ниже или выше двигает границу, «Сбросить» начинает выбор заново. Всё сохраняется в облаке само и видно с ноутбука и телефона. </p>'+
'<h4>Два режима</h4><p>Вверху отрывка переключатель. <b>Изучение</b>: текст, структура, «Спираль», заметки и пометки. <b>Проповедь</b> (на ноутбуке): слева то, что дало изучение; посередине текст проповеди блоками; справа слайды, которые собираются из блоков сами.</p>'+
'<h4>Спираль</h4><p>В отрывке, в среднем поле, есть режим «Спираль»: разбор по методу Осборна этап за этапом. Там же кнопки «Как идти по спирали» и «Ящик инструментов».</p>'+
'<h4>Пометки на тексте</h4><p>Пометки ставятся в режиме «Проповедь»: слева вверху стоит текст отрывка. Нажмите на слово (для словосочетания: первое слово, затем с зажатым Shift последнее) и внизу выберите «Подчеркнуть», «Обвести» или «Стрелка от него». Для стрелки затем нажмите слово, к которому она ведёт. Подпись к пометке и её удаление — в списке под текстом; кнопка → ставит пометку слайдом. Подпись на экране пишется курсивом. Обводка работает, пока слова стоят в одной строке; если они переносятся, вместо неё рисуется подчёркивание.</p>'+
'<h4>Проповедь из блоков</h4><p>Текст проповеди пишется блоками: блок — это пункт или абзац. У блока может быть слайд. Он выходит на экран в тот момент, когда вы начинаете говорить этот блок. Отдельного порядка шагов больше нет: порядок слайдов задаёт сам текст. Справа видна лента слайдов: название, чтение отрывка, слайды блоков, главная мысль, итог.</p>'+
'<p><b>Что где на экране проповеди.</b> Слева — материал из изучения: текст с пометками, структура, заметки к словам. Кнопка → вставляет материал блоком под выбранным блоком; сам материал здесь не меняется, править его нужно в режиме «Изучение». Посередине — блоки; тёмная полоса в блоке — то, что увидит зал. Справа — лента слайдов: клик по слайду ведёт к его блоку, ▶ начинает показ с него.</p>'+
'<p><b>Чтение отрывка.</b> Сразу после названия идёт полный текст отрывка для чтения вслух. Размер шрифта подбирается сам; если весь текст крупно не помещается, он делится на несколько слайдов по границам стихов. Число слайдов считается под размер окна, поэтому на телевизоре оно может отличаться от ленты. Каждый стих начинается с новой строки. Отключается галочкой под названием.</p>'+
'<p><b>Размер шрифта на экране.</b> Текст на каждом слайде сам занимает столько места, сколько есть: мало текста — крупно. Кнопки «−» и «+» рядом с «Показ» (в самом показе клавиши «−» и «+») сдвигают размер для всего отрывка. Если экран уже заполнен, «+» текст не увеличит; на слайдах чтения он тогда разложит отрывок на большее число слайдов.</p>'+
'<p><b>Несколько пометок сразу.</b> У слайда «разметка» пометки отмечаются галочками: все отмеченные появятся на экране одновременно, например подчёркивание слова и стрелка к нему.</p>'+
'<p><b>Какие бывают слайды.</b> «Тезис по центру» — одна мысль на чёрном экране. «Отрывок: открыть фразу» — текст отрывка раскрывается фраза за фразой; с галочкой «вместе с подчинёнными» главная фраза открывается сразу со своими подчинёнными. «Тезис к слову» — слово загорается в отрывке, тезис встаёт столбиком справа; такой блок вставляется кнопкой → у заметки к слову. «Разметка» — весь текст стоит на экране, пометка рисуется поверх. «Параллельное место» — ссылка и текст.</p>'+
'<p><b>Собрать из разбора.</b> Кнопка расставляет черновик: по блоку на каждую главную фразу, под ней блоки тех слов, у которых заполнено поле «На экран» (текстом блока становится ваша заметка к слову). Тезисов она не сочиняет. Нынешние блоки она заменяет, вернуть их можно кнопкой «Отменить».</p>'+
'<p><b>Текст в Word.</b> Скачивает текст проповеди файлом .docx. Перед блоком со слайдом стоит мелкая строка с номером слайда, чтобы на кафедре было видно, когда листать.</p>'+
'<p><b>Показ.</b> «▶ Показ» начинает с названия, кнопка ▶ на слайде в ленте — с него. Стрелка вправо, пробел или кликер — дальше; стрелка влево — назад; Esc — выход. Для зала без интернета нажмите «Файл для зала»: скачается отдельный файл с этим отрывком. После правок файл нужно скачать заново.</p>'+
'<h4>Синхронизация телефона и ноутбука (версия на GitHub)</h4><p>Кнопка «Синхронизация» в библиотеке. Один раз на каждом устройстве введите имя закрытого репозитория (например, dkloban-ctrl/razbor-slova-data) и ключ доступа. Дальше каждое сохранение уходит в репозиторий через несколько секунд, а изменения с другого устройства приходят при открытии приложения, при возвращении к нему и раз в три минуты. Рядом с кнопкой видно время последней синхронизации. Если один отрывок изменили на двух устройствах до синхронизации, остаётся более поздняя версия, а ранняя сохраняется в папке data/conflicts репозитория. Ключ хранится только в этом браузере: на чужом компьютере его не вводите.</p>'+
'<h4>Что означают квадратные скобки</h4><p>Ветхий Завет Синодального перевода переведён с еврейского текста. Переводчики при этом сверялись с древним греческим переводом — Септуагинтой (перевод семидесяти, III–II века до Р. Х.). Слова и фразы, которые есть в греческом тексте, но которых нет в еврейском, они поставили в скобки. Пример: Бытие 1:6 — «[И стало так.]»; в Бытие 5 в скобках даны другие числа лет из греческого текста.</p>'+
'<p><b>Почему в вашей печатной Библии их нет.</b> Издания, которыми обычно пользуются евангельские церкви, следуют только еврейскому тексту и вставки из Септуагинты опускают. Издания со скобками сохраняют текст в том виде, в каком его выпустил Синод.</p>'+
'<p><b>Чем они полезны.</b> Скобка показывает место, где два древних свидетеля текста расходятся. Авторы Нового Завета часто цитируют Ветхий по Септуагинте, поэтому вставка иногда объясняет, почему цитата в Новом Завете звучит не так, как в Ветхом.</p>'+
'<p><b>Как с ними обращаться.</b> Слова в скобках — не часть еврейского текста. Не стройте на них главную мысль и не читайте их с кафедры как Писание без оговорки. Это наблюдение для изучения, а не основание для вывода.</p>'+
'<p>В Новом Завете этого текста скобок почти нет (15 стихов). В Есфири и Данииле в скобках стоят большие неканонические добавления. В отдельных местах вместо квадратных скобок стоят круглые. Курсив печатных изданий (слова, добавленные переводчиками для связи речи) здесь не сохранён.</p>'+
'<h4>Насколько точен текст</h4><p>Текст взят из открытого электронного издания Синодального перевода. При выборочной сверке с другим электронным изданием около девяти стихов из десяти совпали буква в букву; расхождения мелкие: написание отдельных слов, заглавные буквы, вид скобок, нет буквы «ё». Цитату для проповеди сверяйте по bible.by или печатной Библии.</p>'+
'<h4>Сохранение</h4><p>Справа вверху в отрывке видно состояние: «Сохранено в 14:05» или «Не сохранено». Без связи изменения лежат черновиком на этом устройстве и уйдут в облако, когда связь вернётся. Если один отрывок открыт сразу на двух устройствах, останется то, что сохранено последним. «Скачать всю библиотеку» — страховочная копия в файл.</p>'+
'</div>';
function showHelp(){ var w=document.createElement("div"); w.innerHTML=HELP; openModal("Справка","",w,""); }
$("#btnHelp").addEventListener("click",showHelp);
$("#btnHelp2").addEventListener("click",showHelp);

/* ---------- start ---------- */
function startLocal(){
  T=tok(S.source); cleanScript(); lastSnap=JSON.stringify(S); $("#btnUndo").disabled=true;
  document.body.classList.add(MODE==="embed"?"m-embed":"m-local"); setView("work"); setPane("text"); renderAll();
}
function oldLocal(){
  var d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  if(d&&typeof d.source==="string"&&Array.isArray(d.phrases)){ S=normalize(d); }
  else{ S=fresh(DEFAULT_TEXT,DEFAULT_TITLE); T=tok(S.source); cutVerses(); }
}
(async function init(){
  if(EMBED){
    MODE="embed"; LKEY="osb-embed-"+EMBED.id+"-"+EMBED.at;
    var d=null; try{ d=JSON.parse(localStorage.getItem(LKEY)||"null"); }catch(e){}
    S=normalize(d&&typeof d.source==="string"&&Array.isArray(d.phrases)?d:EMBED.S); startLocal(); return;
  }
  S=fresh("",""); setView("lib"); libSt("Подключаюсь к хранилищу…");
  var db=null;
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){}
  if(!db&&STD){ db=LocalDB(); await db.ready; if(!db.ok()) db=null; else{ document.body.classList.add("m-std"); try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){} db.onChange=function(){ syLater(6000); }; } }
  if(!db){ MODE="local"; oldLocal(); startLocal(); say("Хранилище недоступно: работаю с одним отрывком в этом браузере"); return; }
  MODE="cloud"; C.db=db; document.body.classList.add("m-cloud");
  try{ var r=await fetch("bible/index.json"); if(!r.ok) throw 0; BOOKS=await r.json(); }
  catch(e){ libSt("Список книг не загрузился. Проверьте интернет и откройте страницу заново.","bad"); return; }
  var got=false, lt=setTimeout(function(){ if(!got) libSt("Хранилище не отвечает. Проверьте интернет; попытки продолжаются.","bad"); },10000);
  renderLib();
  if(STD) syStart();
  db.collection("passages").limit(1000).onSnapshot(function(q){
    var P={}; q.docs.forEach(function(d){ P[d.id]=clone(d.data()); }); C.P=P;
    if(!q.metadata.fromCache&&!got){ got=true; clearTimeout(lt); libSt(""); }
    if(view==="lib"){ renderBookList(); if(L.tab==="list") renderBookPage(); }
  },function(e){ clearTimeout(lt); libSt("Ошибка хранилища: "+e.code,"bad"); });
  db.collection("books").limit(200).onSnapshot(function(q){
    q.docs.forEach(function(d){ if(!sheetDirty[d.id]) C.BK[d.id]=clone(d.data()); });
    if(view==="lib"&&L.tab==="sheet"&&!(document.activeElement&&document.activeElement.classList.contains("shf"))) renderBookPage();
  },function(){});
})();
})();
</script>
